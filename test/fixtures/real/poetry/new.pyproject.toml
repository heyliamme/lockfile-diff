[project]
name = "lf-poetry"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "attrs>=25.1",
    "toml>=0.10,<0.11",
    "idna==3.10",
    "packaging==24.2",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
iniconfig = "2.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
