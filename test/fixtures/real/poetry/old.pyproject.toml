[project]
name = "lf-poetry"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "attrs==22.2.0",
    "toml>=0.9,<0.10",
    "idna==3.4",
    "six==1.16.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
iniconfig = "1.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
